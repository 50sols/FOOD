name: FOODEX V2 Isolation Gate

on:
  pull_request:
    branches:
      - Foodex_V2

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: foodex-v2-isolation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-v2-only:
    name: V2 target and safety contract
    runs-on: ubuntu-latest
    steps:
      - name: Reject incorrect base, unscoped head, and forbidden production release
        shell: bash
        env:
          V2_BASE: ${{ github.event.pull_request.base.ref }}
          V2_HEAD: ${{ github.event.pull_request.head.ref }}
          V2_TITLE: ${{ github.event.pull_request.title }}
          V2_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          test "$V2_BASE" = 'Foodex_V2' || { echo "::error::V2 PR must target Foodex_V2, never main"; exit 1; }
          printf '%s' "$V2_TITLE" | grep -Eq '(^V2([ :|\[-])|#[0-9]+)' || { echo "::error::V2 Issue reference/title required"; exit 1; }
          printf '%s' "$V2_BODY" | grep -Eiq '#[0-9]+' || { echo "::error::Link a scoped issue in PR body"; exit 1; }
          printf '%s' "$V2_BODY" | grep -Eiq 'Customer.*Driver.*Van|Customer[[:space:]]*/[[:space:]]*Driver[[:space:]]*/[[:space:]]*Van|MOBILE IMPACT|Mobile impact' || { echo "::error::Explicit Customer/Driver/Van impact review required"; exit 1; }
          case "$V2_HEAD" in
            main|Foodex_V2|release/*) echo "::error::V2 PR must come from issue-scoped implementation branch"; exit 1 ;;
          esac
          echo "V2 base and impact contract OK"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify branch policy and forbid release identity changes
        shell: bash
        env:
          V2_HEAD: ${{ github.event.pull_request.head.ref }}
          V2_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          V2_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/foodex-branch-policy.py validate "$V2_HEAD" --base Foodex_V2
          changes="$(git diff --name-only "$V2_BASE_SHA" "$V2_HEAD_SHA")"
          if printf '%s\n' "$changes" | grep -Eq '^(VERSION|Release/Updates/|docs/release/RELEASE_REGISTRY\.json)'; then
            echo "::error::V2 staging may not mutate canonical release identities or production registry"
            exit 1
          fi
          echo "No canonical version/registry publication changes"
      - name: Unit-test issue branch uniqueness guard
        shell: bash
        run: |
          set -euo pipefail
          node --test .github/scripts/v2-issue-branch-uniqueness.test.js
      - name: Unit-test fail-closed original PR resume guard
        shell: bash
        run: |
          set -euo pipefail
          node --test .github/scripts/v2-worker-resume.test.js
      - name: Refuse duplicate issue-scoped remote branches
        uses: actions/github-script@v8
        with:
          script: |
            const gate = require('./.github/scripts/v2-issue-branch-uniqueness.js');
            await gate.run({ github, context, core });
      - name: Resume-first historical PR gate (read-only, no duplicates)
        uses: actions/github-script@v8
        with:
          script: |
            const { buildPlan } = require('./.github/scripts/v2-worker-resume.js');
            const head = context.payload.pull_request.head.ref;
            const match = head.match(/^(?:feat|fix|chore|docs|refactor|test|ci|worker)\/([1-9][0-9]*)-/);
            if (!match) throw Error('Invalid issue-scoped V2 PR branch');
            const plan = await buildPlan({
              github, owner: context.repo.owner, repo: context.repo.repo,
              issueNumber: Number(match[1])
            });
            core.info('V2 original-work reconciliation: ' + JSON.stringify(plan));
            const permitted = (plan.action === 'RESUME_ORIGINAL_PR'
              && plan.original_pr === context.payload.pull_request.number
              && plan.original_branch === head)
              || (plan.action === 'RESUME_ORIGINAL_BRANCH'
                && plan.original_branch === head);
            if (!permitted) {
              core.setFailed('V2 duplicate or unresolved historic PR: ' + plan.action
                + ' — resume existing original branch/PR, never recreate it');
            }

      - name: Verify V2 unified governance source contract and negative regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_v2_unified_contract.py
          python3 -m unittest discover -s scripts/tests -p 'test_v2_unified_contract.py' -v
          python3 scripts/audit_v2_source_coverage.py --report artifacts/v2-2743-source-coverage.json
          python3 -m unittest discover -s scripts/tests -p 'test_v2_source_coverage.py' -v
