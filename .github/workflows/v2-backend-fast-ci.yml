name: FOODEX V2 Scoped Backend CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fast:
    name: Backend fast-fail
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Cache installed Composer dependencies
        uses: actions/cache@v5
        with:
          path: backend/vendor
          key: composer-vendor-v1-${{ runner.os }}-php-8.3-${{ hashFiles('backend/composer.json', 'backend/composer.lock') }}

      - name: Validate Composer manifest
        run: composer validate --strict --no-check-lock

      - name: Install Composer dependencies
        run: |
          if [[ ! -f vendor/autoload.php ]]; then
            composer install --no-interaction --prefer-dist --no-progress
          fi

      - name: Syntax-check application PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find app routes tests -type f -name '*.php' -print0)

      - name: Run backend lint first
        run: composer lint

      - name: Run backend static analysis
        run: composer analyse

      - name: Run Composer security audit
        run: composer audit

      - name: Validate OpenAPI contract
        working-directory: .
        env:
          REDOCLY_TELEMETRY: "off"
          REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
        run: npx --yes @redocly/cli@2.59.0 lint docs/api/openapi.yaml

  backend-smoke:
    name: Backend migrations seed and runtime
    runs-on: ubuntu-latest
    # Full Laravel suite can exceed 20 minutes under runner contention.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Cache installed Composer dependencies
        uses: actions/cache@v5
        with:
          path: backend/vendor
          key: composer-vendor-v1-${{ runner.os }}-php-8.3-${{ hashFiles('backend/composer.json', 'backend/composer.lock') }}

      - name: Install Composer dependencies
        run: |
          if [[ ! -f vendor/autoload.php ]]; then
            composer install --no-interaction --prefer-dist --no-progress
          fi

      - name: Validate complete Laravel shard partition contract
        run: python3 -m unittest discover -s ../scripts/tests -p 'test_laravel_test_shards.py'

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Validate fresh migrations
        run: php artisan migrate:fresh --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Validate deterministic seed data
        run: php artisan db:seed --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Set up Node for live-map runtime tests
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Test live-map runtime and local static assets
        run: node --test tests/Browser/driver-live-map.test.cjs

      - name: Probe production public document-root assets over HTTP
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8099 -t public >/tmp/foodex-public-assets.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8099/assets/admin/driver-live-map.js >/dev/null; then
              break
            fi
            sleep 0.25
          done

          assets=(
            assets/admin/driver-live-map.js
            assets/admin/driver-live-map.css
            assets/leaflet/1.9.4/leaflet.js
            assets/leaflet/1.9.4/leaflet.css
            assets/leaflet/1.9.4/images/marker-icon.png
            assets/leaflet/1.9.4/images/marker-shadow.png
            brand/foodex-economical-group.webp
          )

          for asset in "${assets[@]}"; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8099/$asset")"
            test "$status" = "200" || {
              echo "::error::$asset returned HTTP $status from backend/public document root"
              cat /tmp/foodex-public-assets.log
              exit 1
            }
          done

          grep -F 'RewriteCond %{REQUEST_FILENAME} !-f' public/.htaccess
          grep -F 'RewriteCond %{REQUEST_FILENAME} !-d' public/.htaccess


  backend-shards:
    name: Laravel test shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Cache installed Composer dependencies
        uses: actions/cache@v5
        with:
          path: backend/vendor
          key: composer-vendor-v1-${{ runner.os }}-php-8.3-${{ hashFiles('backend/composer.json', 'backend/composer.lock') }}

      - name: Install Composer dependencies
        run: |
          if [[ ! -f vendor/autoload.php ]]; then
            composer install --no-interaction --prefer-dist --no-progress
          fi


      - name: Prepare isolated Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Generate deterministic exhaustive shard configuration
        run: |
          python3 ../scripts/laravel-test-shards.py --verify --count 4
          python3 ../scripts/laravel-test-shards.py --count 4 --index "${{ matrix.shard }}" --output .phpunit-shard.xml

      - name: Run complete Laravel shard
        run: |
          php artisan config:clear --ansi
          php artisan test --configuration=.phpunit-shard.xml --log-junit=laravel-shard-${{ matrix.shard }}.xml

      - name: Preserve shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-shard-${{ matrix.shard }}
          path: backend/laravel-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn

  backend:
    name: Backend tests
    if: ${{ always() && !cancelled() }}
    needs: [fast, backend-smoke, backend-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require fast-fail, full migrations/runtime, and every Laravel shard
        shell: bash
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          SMOKE_RESULT: ${{ needs.backend-smoke.result }}
          SHARDS_RESULT: ${{ needs.backend-shards.result }}
        run: |
          set -euo pipefail
          for result in "$FAST_RESULT" "$SMOKE_RESULT" "$SHARDS_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::Backend acceptance failed: fast=$FAST_RESULT smoke=$SMOKE_RESULT shards=$SHARDS_RESULT"
              exit 1
            fi
          done

