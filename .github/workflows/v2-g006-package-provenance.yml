name: FOODEX V2 G006 ZIP provenance unit tests

on:
  pull_request:
    branches: [Foodex_V2]
    paths:
      - 'scripts/v2_upgrade_package_provenance.py'
      - 'scripts/tests/test_v2_upgrade_package_provenance.py'
      - 'scripts/v2_g006_patch_historical_recovery.py'
      - 'scripts/tests/test_v2_g006_patch_historical_recovery.py'
      - 'scripts/ci-125-recovery-upgrade.sh'
      - 'scripts/ci-127-upgrade.sh'
      - 'scripts/v2_g006_reconcile_interrupted_125.php'
      - 'scripts/v2_g006_patch_continuous_127.py'
      - 'scripts/tests/test_v2_g006_patch_continuous_127.py'
      - 'docs/v2/qa/2747-upgrade-package-provenance-g006.md'
      - '.github/workflows/v2-g006-package-provenance.yml'
  push:
    branches:
      - 'test/2747-v2-upgrade-package-provenance-g006'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-g006-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-zip-manifest-contract:
    name: Synthetic ZIP security and historical edge contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source checkout identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate Python source syntax
        run: python3 -m py_compile scripts/v2_upgrade_package_provenance.py scripts/tests/test_v2_upgrade_package_provenance.py scripts/v2_g006_patch_historical_recovery.py scripts/tests/test_v2_g006_patch_historical_recovery.py scripts/v2_g006_patch_continuous_127.py scripts/tests/test_v2_g006_patch_continuous_127.py
      - name: Execute positive and adversarial ZIP unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_v2_upgrade_package_provenance.py' -v
      - name: Verify fail-closed historical fixture patch contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_v2_g006_patch_historical_recovery.py' -v
      - name: Verify fail-closed continuous-chain database patch contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_v2_g006_patch_continuous_127.py' -v

  verify-published-historical-bytes:
    name: Real v125/v127 archived Update ZIP integrity (not deploy/upgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_125: 1a4d2ba341424c816040a7185a9ab1df59c3d574
      SOURCE_127: a75d3780a8cf1eeb702781adbb17a5dcfd7d8130
      SHA_125: b4fd85f983469c754c50cbb2b3d3f6d6474545863d4ea41a7b3728cce36cfb52
      SHA_127: fd7c801c333c902d5d6704283eba75de24c7aeae46bcbbe6ebaac6e5dc6fdf46
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin source tag refs without changing releases
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.125" --jq .object.sha)" = "$SOURCE_125"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.127" --jq .object.sha)" = "$SOURCE_127"
      - name: Download fixed published release assets read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g006/v125" "$RUNNER_TEMP/g006/v127"
          for v in 125 127; do
            gh release download "v1.0.$v" -R "$GITHUB_REPOSITORY" \
              -p 'FOODEX-Update.zip' -p 'FOODEX-Update.json' \
              -p 'FOODEX-Update.sha256.txt' -p 'FOODEX-Update.files.txt' \
              --dir "$RUNNER_TEMP/g006/v$v"
          done
      - name: Validate immutable bytes and both real compatibility edges
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$SHA_125" "$RUNNER_TEMP/g006/v125/FOODEX-Update.zip" | sha256sum -c -
          printf '%s  %s\n' "$SHA_127" "$RUNNER_TEMP/g006/v127/FOODEX-Update.zip" | sha256sum -c -
          python3 scripts/v2_upgrade_package_provenance.py \
            --upgrade-124-125 "$RUNNER_TEMP/g006/v125" \
            --upgrade-125-127 "$RUNNER_TEMP/g006/v127" \
            --source-125 "$SOURCE_125" --source-127 "$SOURCE_127"
          echo 'Historical archive-integrity evidence only; no signature authentication or MySQL upgrade performed.'

  verify-real-historical-mysql-upgrades:
    name: Real pinned v124-to-v125-to-v127 ZIP MySQL recovery on one database
    needs: verify-published-historical-bytes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: foodex_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pfoodex_ci_only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout the exact G006 candidate and historic tags
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install isolated PHP and historical Composer tooling
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mysqli, mbstring, zip, bcmath, intl, gd, fileinfo, openssl
          coverage: none
          tools: composer:v2
      - name: Verify the pinned source chain and create one disposable MySQL database
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'v1.0.125^{commit}')" = '1a4d2ba341424c816040a7185a9ab1df59c3d574'
          test "$(git rev-parse 'v1.0.127^{commit}')" = 'a75d3780a8cf1eeb702781adbb17a5dcfd7d8130'
          php -r '
          $dbh = new PDO("mysql:host=127.0.0.1;port=3306", "root", "foodex_ci_only", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          $dbh->exec("CREATE DATABASE `foodex_recovery_125` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");
          '
      - name: Download historical released ZIPs read-only with pinned checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/g006-historical-mysql"
          mkdir -p "$base/assets-125" "$base/assets-127"
          for v in 125 127; do
            gh release download "v1.0.$v" -R "$GITHUB_REPOSITORY" \
              -p FOODEX-Update.zip -p FOODEX-Update.json \
              -p FOODEX-Update.sha256.txt -p FOODEX-Update.files.txt \
              --dir "$base/assets-$v"
          done
          printf '%s  %s\n' 'b4fd85f983469c754c50cbb2b3d3f6d6474545863d4ea41a7b3728cce36cfb52' "$base/assets-125/FOODEX-Update.zip" | sha256sum -c -
          printf '%s  %s\n' 'fd7c801c333c902d5d6704283eba75de24c7aeae46bcbbe6ebaac6e5dc6fdf46' "$base/assets-127/FOODEX-Update.zip" | sha256sum -c -
          python3 scripts/v2_upgrade_package_provenance.py \
            --upgrade-124-125 "$base/assets-125" \
            --upgrade-125-127 "$base/assets-127" \
            --source-125 1a4d2ba341424c816040a7185a9ab1df59c3d574 \
            --source-127 a75d3780a8cf1eeb702781adbb17a5dcfd7d8130
          # The historical G006 branch predates this helper. Pin the exact
          # canonical Git blob; never load unverified code from a mutable ref.
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/484a7cb5ba6258d810aaaf7b6a14540962e5e66b" --jq .content |
            tr -d '\n' | base64 -d > "$base/verified-recovery-manifest-preflight.py"
          test "$(git hash-object "$base/verified-recovery-manifest-preflight.py")" = '484a7cb5ba6258d810aaaf7b6a14540962e5e66b'
      - name: Apply both published ZIP edges sequentially on the same populated MySQL database
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/g006-historical-mysql"
          cleanup() {
            git worktree remove --force "$base/tag-125" >/dev/null 2>&1 || true
            git worktree remove --force "$base/tag-127" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for v in 125 127; do
            target="$base/tag-$v"
            git worktree add --detach "$target" "v1.0.$v"
            test "$(tr -d '[:space:]' < "$target/VERSION")" = "1.0.$v"
            mkdir -p "$target/dist/update"
            cp "$base/assets-$v/FOODEX-Update.zip" "$base/assets-$v/FOODEX-Update.json" "$target/dist/update/"
            cp "$base/verified-recovery-manifest-preflight.py" "$target/scripts/verify-recovery-update-manifest.py"
            if [ "$v" = 125 ]; then
              cp "$GITHUB_WORKSPACE/scripts/ci-125-recovery-upgrade.sh" "$target/scripts/"
              cp "$GITHUB_WORKSPACE/scripts/v2_g006_reconcile_interrupted_125.php" "$target/scripts/"
              python3 "$GITHUB_WORKSPACE/scripts/v2_g006_patch_historical_recovery.py" "$target/scripts/ci-125-recovery-upgrade.sh"
              bash -n "$target/scripts/ci-125-recovery-upgrade.sh"
              php -l "$target/scripts/v2_g006_reconcile_interrupted_125.php"
            else
              cp "$GITHUB_WORKSPACE/scripts/ci-127-upgrade.sh" "$target/scripts/"
              python3 "$GITHUB_WORKSPACE/scripts/v2_g006_patch_continuous_127.py" "$target/scripts/ci-127-upgrade.sh"
              bash -n "$target/scripts/ci-127-upgrade.sh"
            fi
          done
          # Historical shell harness derives root from its current directory.
          (
            cd "$base/tag-125"
            bash scripts/ci-125-recovery-upgrade.sh
          )
          (
            cd "$base/tag-127"
            bash scripts/ci-127-upgrade.sh
          )
          # Prove the first transition's order and immutable discount audit survived the second transition.
          php <<'PHP'
          <?php
          $db = new PDO("mysql:host=127.0.0.1;dbname=foodex_recovery_125", "root", "foodex_ci_only", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          $firstOrder = $db->query("SELECT id FROM orders WHERE order_number='RECOVERY-125-CI'")->fetchColumn();
          if (!$firstOrder) {
              throw new RuntimeException('v124->v125 order disappeared during the subsequent v125->v127 upgrade');
          }
          $firstAudit = $db->prepare("SELECT reason FROM order_customer_service_discounts WHERE order_id=? AND idempotency_key=?");
          $firstAudit->execute([$firstOrder, '6b676f27-84ec-4aba-8507-5e62d7b44f23']);
          if ($firstAudit->fetchColumn() !== 'preserve discount audit across interrupted deployment') {
              throw new RuntimeException('v124->v125 discount audit disappeared during the subsequent v125->v127 upgrade');
          }
          $secondOrder = $db->query("SELECT id FROM orders WHERE order_number='UPGRADE-125-127-CI'")->fetchColumn();
          if (!$secondOrder) {
              throw new RuntimeException('v125->v127 order fixture is missing from the continuous database');
          }
          $secondAudit = $db->prepare("SELECT reason FROM order_customer_service_discounts WHERE order_id=? AND idempotency_key=?");
          $secondAudit->execute([$secondOrder, '4bf3e1bc-0d57-473b-a99d-b4c21125b127']);
          if ($secondAudit->fetchColumn() !== 'keep customer discount audit') {
              throw new RuntimeException('v125->v127 discount audit is missing from the continuous database');
          }
          $ownerId = $db->query("SELECT id FROM users WHERE email='upgrade-125@example.invalid'")->fetchColumn();
          $owner = $db->prepare("SELECT COUNT(*) FROM platform_owner_registry WHERE id=1 AND user_id=?");
          $owner->execute([$ownerId]);
          if (!$ownerId || (int) $owner->fetchColumn() !== 1) {
              throw new RuntimeException('v127 platform owner identity is not preserved in the continuous database');
          }
          echo "PASS: both historical transitions and both audit datasets coexist in the same MySQL database" . PHP_EOL;
          PHP
          echo "PASS: actual pinned v124 -> v125 interrupted recovery -> v127 update chain ran sequentially on one populated MySQL database; first-edge order/audit survived second edge."
          echo "NOT PROVEN: trusted publisher signature, general production-safe automatic recovery, full Admin Update Center backup/rollback/recovery, final V2 release or production upgrade."
